name: QA de seguridad automatizado

on:
  schedule:
    # Cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/security-qa.yml'

permissions:
  contents: read
  issues: write

jobs:
  dependency-audit:
    name: Auditoría de dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # --omit=dev: nos interesa lo que realmente se despliega (web en Render, API en Render).
      # @capacitor/cli (devDependency, solo para compilar el APK Android a mano) queda fuera:
      # su cadena de dependencias (xcode->uuid) no forma parte del sistema en producción.
      - name: Auditar backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Auditar frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

  backend-tests:
    name: Suite de tests del backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estacionamientos
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/estacionamientos
      JWT_SECRET: ci_test_secret_no_usar_en_produccion
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci
      - name: Aplicar migraciones
        working-directory: backend
        run: npm run migrate:up
      - name: Correr tests (incluye regresión de escalación de privilegios)
        working-directory: backend
        run: npm test

  frontend-tests:
    name: Suite de tests del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Correr tests
        working-directory: frontend
        run: npm test

  production-security-smoke-test:
    name: Pruebas de seguridad contra producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Ejecutar pruebas de caja negra contra la API en vivo
        working-directory: backend
        env:
          QA_API_URL: https://estacionamientos-api.onrender.com
          # Cuenta admin propia del QA, guardada como secretos del repositorio (Settings > Secrets and
          # variables > Actions). Si no están definidos, el script usa la cuenta demo de los datos de
          # ejemplo (solo sirve mientras esa cuenta siga activa en producción).
          QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
        run: node scripts/security-qa.mjs

  # Un solo issue abierto por racha de fallas: si ya hay uno, se comenta en él en vez de abrir
  # otro cada 6 h; y cuando una corrida vuelve a pasar, se cierra solo.
  reportar-falla:
    name: Crear o actualizar el issue si algo falló
    needs: [dependency-audit, backend-tests, frontend-tests, production-security-smoke-test]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ahora = new Date().toISOString().slice(0,16).replace('T',' ');
            const abiertos = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'security,automated'
            });
            const previo = abiertos.find(i => !i.pull_request && i.title.startsWith('🚨 QA de seguridad falló'));
            if (previo) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: previo.number,
                body: `Volvió a fallar (${ahora} UTC). Log: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `🚨 QA de seguridad falló — ${ahora} UTC`,
                body: `Una o más verificaciones automáticas de seguridad fallaron.\n\nRevisa el log del workflow: ${runUrl}`,
                labels: ['security', 'automated']
              });
            }

  cerrar-issues-resueltos:
    name: Cerrar issues de fallas anteriores
    needs: [dependency-audit, backend-tests, frontend-tests, production-security-smoke-test]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const abiertos = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'security,automated'
            });
            for (const i of abiertos.filter(i => !i.pull_request && i.title.startsWith('🚨 QA de seguridad falló'))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number,
                body: `Resuelto: todas las verificaciones volvieron a pasar en ${runUrl}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number,
                state: 'closed', state_reason: 'completed'
              });
            }
